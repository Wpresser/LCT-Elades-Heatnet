name: Release acceptance

on:
  push:
    branches: [main, 'codex/final-release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      HEATNET_TERMINAL_POLICY: relaxed
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Java 11 tests
        working-directory: service
        run: ./mvnw -B test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Viewer clean install, tests, types and production build
        working-directory: viewer
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test:policy
          npm run typecheck
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Asset consistency, validator tests and synthetic scenarios
        run: |
          python scripts/sync_viewer_data.py --check
          python scripts/sync_presentation_aliases.py --check
          python scripts/check_release_metrics.py
          python -m pytest validator/test_validator.py scripts/test_release_checks.py -q
          python scenarios/check_scenarios.py service/target/scenarios
      - name: Release validation (main result, clarifications 29.09 No. 15)
        run: |
          mkdir -p .release-check
          python results/tools/lct_audit.py --input "task/sources/Датасет скорректированный.geojson" --output results/final_main.geojson --terminal-policy exterior-fallback --json .release-check/main-audit.json
          python validator/validator.py "task/sources/Датасет скорректированный.geojson" results/final_main.geojson
          python results/tools/output_contract_check.py "task/sources/Датасет скорректированный.geojson" results/final_main.geojson
      - name: Strict §2.2 comparison result validation
        run: |
          python results/tools/lct_audit.py --input "task/sources/Датасет скорректированный.geojson" --output results/final_strict.geojson --terminal-policy strict --json .release-check/strict-audit.json
          python validator/validator.py "task/sources/Датасет скорректированный.geojson" results/final_strict.geojson
          python results/tools/output_contract_check.py "task/sources/Датасет скорректированный.geojson" results/final_strict.geojson
      - name: Compose config and image build
        run: |
          docker compose config --quiet
          docker compose build
      - name: Production startup and PostgreSQL readiness
        run: |
          docker compose up -d
          timeout 120 bash -c 'until docker compose exec -T db pg_isready -U heatnet -d heatnet; do sleep 2; done'
      - name: Real API E2E and generated-output validation
        run: python scripts/api_e2e.py
      - name: PostgreSQL and application restart persistence
        run: |
          docker compose restart db
          timeout 120 bash -c 'until docker compose exec -T db pg_isready -U heatnet -d heatnet; do sleep 2; done'
          docker compose restart app
          python scripts/api_e2e.py --verify-existing --output .release-check/api-after-restart.geojson
      - name: Install and verify required docker-compose 1.29.2
        run: |
          mkdir -p "$RUNNER_TEMP/compose-1.29.2"
          cd "$RUNNER_TEMP/compose-1.29.2"
          curl --fail --silent --show-error --location --retry 3 https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64 -o docker-compose
          echo 'f3f10cf3dbb8107e9ba2ea5f23c1d2159ff7321d16f0a23051d68d8e2547b323  docker-compose' | sha256sum --check
          chmod +x docker-compose
          ./docker-compose --version
      - name: Required legacy Compose startup and real API
        env:
          APP_PORT: "18081"
        run: |
          "$RUNNER_TEMP/compose-1.29.2/docker-compose" -p heatnet-legacy up --build -d
          python scripts/api_e2e.py --base-url http://localhost:18081 --output .release-check/legacy-result.geojson --report .release-check/legacy-e2e.json
      - name: Legacy Compose restart persistence and documented recreate path
        env:
          APP_PORT: "18081"
        run: |
          "$RUNNER_TEMP/compose-1.29.2/docker-compose" -p heatnet-legacy down
          "$RUNNER_TEMP/compose-1.29.2/docker-compose" -p heatnet-legacy up -d
          python scripts/api_e2e.py --base-url http://localhost:18081 --verify-existing --output .release-check/legacy-after-restart.geojson --report .release-check/legacy-e2e.json
      - name: Compose diagnostics
        if: always()
        run: |
          mkdir -p .release-check
          docker compose ps -a
          docker compose logs --no-color > .release-check/docker.log
          if [ -x "$RUNNER_TEMP/compose-1.29.2/docker-compose" ]; then
            "$RUNNER_TEMP/compose-1.29.2/docker-compose" -p heatnet-legacy logs --no-color > .release-check/legacy-docker.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            .release-check/
            service/target/surefire-reports/
            service/target/scenarios/
          if-no-files-found: error
          include-hidden-files: true
      - name: Stop test deployment
        if: always()
        run: |
          docker compose down
          if [ -x "$RUNNER_TEMP/compose-1.29.2/docker-compose" ]; then
            "$RUNNER_TEMP/compose-1.29.2/docker-compose" -p heatnet-legacy down
          fi
