# Проверено docker-compose 1.29.2 и Docker Compose v5 (build, up, API E2E, перезапуск); подробности — docs/EXPERT_FEEDBACK.md.
# Если docker-compose 1.29.2 при повторном up пишет «Network … needs to be recreated» — docker-compose down (тома сохраняются), затем up.
# Все настройки можно переопределить переменными окружения или файлом .env рядом с этим файлом.
version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: heatnet
      POSTGRES_USER: heatnet
      POSTGRES_PASSWORD: heatnet
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: ./service
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/heatnet
      DB_USER: heatnet
      DB_PASSWORD: heatnet
      # расчётов одновременно (остальные задания ждут в очереди, API отвечает)
      COMPUTE_MAX_PARALLEL: "${COMPUTE_MAX_PARALLEL:-2}"
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75}"
      # трактовка §2.2 (literal | exterior | relaxed), см. service/src/main/java/.../routing/TerminalPolicy.java
      # relaxed — по умолчанию (дополнительные разъяснения 29.09, №15: ближайшая точка внешней границы,
      # затем другая подходящая точка внешней границы); literal — строгое прочтение для сравнения, 14/17.
      HEATNET_TERMINAL_POLICY: "${HEATNET_TERMINAL_POLICY:-relaxed}"
      # true — выравнивать трассы вдоль локальных осей застройки (замечание экспертов); false — прежняя геометрия
      HEATNET_ALIGN: "${HEATNET_ALIGN:-true}"
      # true — выдавать третий вариант «каждая цель отдельно» (базовая линия для сравнения)
      HEATNET_SEPARATE_VARIANT: "${HEATNET_SEPARATE_VARIANT:-false}"
      HEATNET_ORDER_BUDGET_MS: "${HEATNET_ORDER_BUDGET_MS:-60000}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  db-data:
  app-data:
